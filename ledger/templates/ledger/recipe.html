{% extends 'base.html' %}

{% load static %}

{% block title %}{% endblock %}
{% block content %}
    <h2>{{object.name}}<h2></h2>
    <p>by {{ object.author.name }}</p>
    <ul>
        {% for ingredient in object.ingredients.all %}
        <li>
            {{ingredient.quantity}} {{ingredient.ingredient.name}}
        </li>
        {% endfor %}
    </ul>
{% endblock %}
