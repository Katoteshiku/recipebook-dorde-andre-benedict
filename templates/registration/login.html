{% extends 'base.html' %}

{% load static %}

{% block page %}Login Page{% endblock %}
{% block content %}
    {% if form.errors %}
        <p>{{ form.errors }}</p>
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
{% endblock %}
